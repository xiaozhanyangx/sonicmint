<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="声刻 Demo 封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4be0"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2350"/>
      <stop offset="1" stop-color="#141029"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow)"/>

  <!-- 黑胶 -->
  <circle cx="300" cy="288" r="172" fill="url(#disc)"/>
  <circle cx="300" cy="288" r="172" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="300" cy="288" r="140" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="300" cy="288" r="108" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="300" cy="288" r="76" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>

  <!-- 中心标签 -->
  <circle cx="300" cy="288" r="44" fill="#f59e0b"/>
  <circle cx="300" cy="288" r="9" fill="#141029"/>

  <!-- 声波 -->
  <g stroke="#ffffff" stroke-opacity=".85" stroke-linecap="round" stroke-width="9">
    <line x1="150" y1="270" x2="150" y2="306"/>
    <line x1="178" y1="252" x2="178" y2="324"/>
    <line x1="422" y1="256" x2="422" y2="320"/>
    <line x1="450" y1="272" x2="450" y2="304"/>
  </g>

  <text x="300" y="508" text-anchor="middle" fill="#ffffff"
        font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="46" font-weight="700" letter-spacing="2">声刻 Demo</text>
  <text x="300" y="546" text-anchor="middle" fill="#ffffff" fill-opacity=".72"
        font-family="'Segoe UI',system-ui,sans-serif"
        font-size="22" letter-spacing="4">SONICMINT</text>
</svg>