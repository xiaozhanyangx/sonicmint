<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>声刻 · 链上曲库</title>
  <meta name="description" content="声刻 SonicMint 曲库：播放链上永久音乐，支持订阅免费播放与付费点播，版税即时结算。" />
  <meta name="theme-color" content="#5b4be0" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b4be0'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
  <script>
    try {
      var t = localStorage.getItem("tapeout_theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__brand">
      <a href="./index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;">
        <span class="nav__logo">🎵</span>
        <span class="nav__title" data-i18n="nav.brand">声刻</span>
      </a>
    </div>
    <div class="nav__right">
      <a href="./publish.html" class="btn btn--primary" data-i18n="nav.publish">发行唱片</a>
      <a href="./rules.html" class="btn btn--ghost" data-i18n="nav.rules">发行规则</a>
      <div class="net-switch">
        <button id="netBnb" class="btn btn--ghost btn--net" data-chain="56">BNB</button>
        <button id="netXlayer" class="btn btn--ghost btn--net" data-chain="196">X Layer</button>
      </div>
      <span id="subBadge" class="badge" hidden data-i18n="nav.subscribed">订阅中 ✓</span>
      <button id="subscribeBtn" class="btn btn--ghost" hidden data-i18n="nav.subscribe">订阅</button>
      <span id="chainBadge" class="badge" data-i18n="nav.unconnected">未连接</span>
    </div>
    <button id="connectBtn" class="btn btn--primary nav__connect" data-i18n="nav.connect">连接钱包</button>
    <button id="themeToggle" class="icon-btn" aria-label="切换深色模式">🌙</button>
    <button id="langToggle" class="icon-btn lang-btn" aria-label="切换语言">中</button>
    <button id="navToggle" class="nav__toggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- 移动端菜单 -->
  <div id="navMenu" class="nav__menu">
    <a href="./publish.html" class="nav__menu-item" data-i18n="nav.menuPublish">💿 发行唱片</a>
    <a href="./rules.html" class="nav__menu-item" data-i18n="nav.menuRules">📋 发行规则</a>
    <div class="nav__menu-item nav__menu-net">
      <span class="nav__menu-label" data-i18n="nav.net">网络</span>
      <div class="net-switch">
        <button id="netBnbM" class="btn btn--ghost btn--net" data-chain="56">BNB</button>
        <button id="netXlayerM" class="btn btn--ghost btn--net" data-chain="196">X Layer</button>
      </div>
    </div>
  </div>

  <main class="container">
    <!-- Hero：黑胶唱片 -->
    <section class="hero">
      <div class="hero__vinyl">
        <div class="vinyl">
          <div class="vinyl__disc">
            <div class="vinyl__groove"></div>
            <div class="vinyl__groove vinyl__groove--2"></div>
            <div class="vinyl__groove vinyl__groove--3"></div>
            <div class="vinyl__label">
              <img id="heroCover" src="" alt="" hidden />
              <div id="heroCoverFallback" class="vinyl__label-fallback">🎵</div>
              <div class="vinyl__hole"></div>
            </div>
          </div>
          <div class="vinyl__tonearm">
            <div class="tonearm__base"></div>
            <div class="tonearm__arm"></div>
            <div class="tonearm__head"></div>
          </div>
        </div>
      </div>
      <div class="hero__text">
        <h1><span data-i18n="hero.title1">链上曲库</span><br/><span class="hero__accent" data-i18n="hero.title2">永久可播放的音乐</span></h1>
        <p class="muted" data-i18n="hero.desc">所有音频存于 TapeOut 链上容器，版税由智能合约即时结算。订阅可免费播放，或按次付费点播。</p>
        <div class="hero__actions">
          <a href="./publish.html" class="btn btn--primary" data-i18n="hero.cta1">发行我的唱片</a>
          <a href="./rules.html" class="btn btn--ghost" data-i18n="hero.cta2">了解规则</a>
        </div>
      </div>
    </section>

    <!-- 创作者面板（版税仪表盘） -->
    <section id="creatorPanel" class="card creator" hidden>
      <div class="card__head">
        <h2 data-i18n="creator.title">创作者面板</h2>
        <span id="creatorName" class="muted small"></span>
      </div>
      <div class="creator__grid">
        <div class="creator__stat">
          <div id="statTracks" class="creator__num">0</div>
          <div class="creator__label" data-i18n="creator.mine">已发行</div>
        </div>
        <div class="creator__stat">
          <div id="statEarned" class="creator__num">0</div>
          <div class="creator__label" data-i18n="creator.earned">累计版税</div>
        </div>
        <div class="creator__stat">
          <div id="statPending" class="creator__num">0</div>
          <div class="creator__label" data-i18n="creator.pending">待结算播放</div>
        </div>
      </div>
      <div class="creator__detail">
        <div id="creatorDetailList"></div>
      </div>
    </section>

    <!-- 曲库 -->
    <section class="card">
      <div class="card__head">
        <h2 data-i18n="lib.title">曲库</h2>
        <div class="card__head-right">
          <span id="poolInfo" class="muted small"></span>
          <button id="refreshBtn" class="btn btn--ghost" data-i18n="lib.refresh">刷新</button>
        </div>
      </div>
      <div class="library-toolbar">
        <input id="searchInput" type="search" class="search-input" placeholder="搜索曲目 / 艺人…" data-i18n-ph="lib.searchPh" />
        <div class="seg">
          <button id="filterAll" class="btn btn--ghost btn--seg is-active" data-i18n="lib.all">全部</button>
          <button id="filterMine" class="btn btn--ghost btn--seg" data-i18n="lib.mine">我的</button>
        </div>
      </div>
      <div id="recentSection" class="recent" hidden>
        <div class="recent__head" data-i18n="lib.recent">最近播放</div>
        <div id="recentList" class="tracks"></div>
      </div>
      <div id="trackList" class="tracks">
        <p class="muted">加载中…</p>
      </div>
    </section>

    <!-- 播放器 -->
    <section id="playerSection" class="card player" hidden>
      <div class="player__cover-wrap">
        <img id="playerCover" class="player__cover" hidden alt="封面" />
        <div id="playerCoverFallback" class="player__cover-fallback">🎵</div>
      </div>
      <div class="player__main">
        <div class="player__info">
          <div class="player__title" id="playerTitle"></div>
          <div class="player__artist muted" id="playerArtist"></div>
        </div>
        <div class="player__controls">
          <button id="prevBtn" class="icon-btn" aria-label="上一曲">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true"><path d="M6 6h2v12H6V6zM20 6l-9 6 9 6V6z"/></svg>
          </button>
          <audio id="audio" controls></audio>
          <button id="nextBtn" class="icon-btn" aria-label="下一曲">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true"><path d="M4 6l9 6-9 6V6zm10 0h2v12h-2V6z"/></svg>
          </button>
        </div>
        <div class="player__actions">
          <span class="muted small" id="playerStats"></span>
          <button id="shareBtn" class="btn btn--ghost" data-i18n="player.share">分享</button>
          <button id="playBtn" class="btn btn--primary">付费播放</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footer.text">音频存于 TapeOut 链上容器 · 版税合约即时结算 · 无服务器</p>
  </footer>

  <script src="./ethers.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js'"></script>
  <script src="./lang.js"></script>
  <script src="./app.js"></script>
</body>
</html>
